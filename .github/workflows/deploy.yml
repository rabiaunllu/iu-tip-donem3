name: İÜ Tıp Ders Programı Dağıtımı

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Her Pazar 18:00 UTC (Türkiye saatiyle 21:00) otomatik canlı verileri güncelle
    - cron: '0 18 * * 0'
  workflow_dispatch: # GitHub arayüzünden elle tek tıkla başlatma

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Canlı E-Tablo ve Rotasyon Veritabanını Derle
        run: |
          python scripts/build_data.py

      - name: GitHub Pages Yapılandır
        uses: actions/configure-pages@v4

      - name: Dosyaları Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
