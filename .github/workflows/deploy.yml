name: İÜ Tıp Ders Programı Dağıtımı

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # GitHub arayüzünden elle tek tıkla başlatma

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # FIX-12: Node.js kurulumu — verify_integrity.js için gerekli
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      # FIX-11: Hata yutma (|| echo) kaldırıldı — build hatası artık pipeline'ı durduracak
      - name: Canlı E-Tablo ve Rotasyon Veritabanını Derle
        run: python scripts/build_data.py

      # FIX-12: Doğrulama scripti artık CI/CD'de çalışıyor
      - name: Veri Bütünlüğünü Doğrula
        run: node scripts/verify_integrity.js

      - name: Web Sitesi Yayın Paketini Hazırla (_site)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.json _site/
          cp sw.js _site/
          cp icon.svg _site/
          cp -r css _site/
          cp -r js _site/
          cp -r data _site/
          cp -r docs _site/

      - name: GitHub Pages Yapılandır
        uses: actions/configure-pages@v4

      - name: Dosyaları Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4

